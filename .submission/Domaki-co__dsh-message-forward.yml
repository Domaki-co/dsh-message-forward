url: https://github.com/Domaki-co/dsh-message-forward
name: Domaki-co/dsh-message-forward
category: session
description:
  en: 'WeChat-style forwarding between DSH sessions: forward one model reply, a user message, or a multi-selected batch of messages and images into another session, with silent send, draft fill, or send-and-jump delivery, plus code-block-only extraction and prompt templates.'
  zh: '微信风格的 DSH 会话间转发：把单条模型回复、用户消息或多选合并的消息与图片转发到另一个会话，支持静默发送、填入草稿、发送并跳转三种投递方式，并可仅提取代码块或套用提示词模板。'
